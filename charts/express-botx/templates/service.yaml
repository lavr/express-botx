apiVersion: v1
kind: Service
metadata:
  name: {{ include "express-botx.fullname" . }}
  labels:
    {{- include "express-botx.labels" . | nindent 4 }}
  {{- with include "express-botx.annotations" (dict "context" $ "extra" dict) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: {{ include "express-botx.portName" . }}
  selector:
    {{- include "express-botx.selectorLabels" . | nindent 4 }}
