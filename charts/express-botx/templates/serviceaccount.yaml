{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "express-botx.serviceAccountName" . }}
  labels:
    {{- include "express-botx.labels" . | nindent 4 }}
  {{- with include "express-botx.annotations" (dict "context" $ "extra" .Values.serviceAccount.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
