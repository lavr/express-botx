# Two teams share one endpoint but have independent tokens, chat scopes,
# filters, templates, error statuses, and routes.
bots:
  notifications:
    host: env:BOT_HOST
    id: env:BOT_ID
    secret: env:BOT_SECRET

chats:
  backend:
    id: env:BACKEND_CHAT_ID
    bot: notifications
  backend-mrs:
    id: env:BACKEND_MRS_CHAT_ID
    bot: notifications
  backend-oncall:
    id: env:BACKEND_ONCALL_CHAT_ID
    bot: notifications
  frontend:
    id: env:FRONTEND_CHAT_ID
    bot: notifications
  frontend-oncall:
    id: env:FRONTEND_ONCALL_CHAT_ID
    bot: notifications

server:
  listen: ":8080"
  base_path: /api/v1
  gitlab:
    senders:
      - name: backend
        secret: env:BACKEND_GITLAB_TOKEN
        # Explicit scope: every route target must resolve inside this list.
        chats: [backend, backend-mrs, backend-oncall]
        events:
          only: ["merge_request.*", "pipeline.failed", "build.failed", push]
          exclude: ["merge_request.update"]
        error_events: ["pipeline.failed", "build.failed"]
        templates:
          "merge_request.open": "🆕 MR [{{ .Project }}]: {{ .Title }}\n{{ .URL }}"
          pipeline: "🚦 {{ .Project }} pipeline: {{ .Action }}\n{{ .URL }}"
        routes:
          - match:
              event: [merge_request]
            chats: [backend-mrs]
          - match:
              event: ["pipeline.failed", "build.failed"]
            chats: [backend-oncall]
            stop: true
          # Routes have no implicit fallback. Keep an explicit catch-all when
          # every otherwise-unmatched event should still be delivered.
          - match: {}
            chats: [backend]

      - name: frontend
        secret: env:FRONTEND_GITLAB_TOKEN
        chats: [frontend, frontend-oncall]
        events:
          only: [push, "pipeline.*"]
        error_events: ["pipeline.failed"]
        templates:
          push: "🌐 {{ .User }} pushed to {{ .Project }}\n{{ .URL }}"
          pipeline: "🌐 {{ .Project }} pipeline: {{ .Action }}\n{{ .URL }}"
        routes:
          - match:
              event: ["pipeline.failed"]
            chats: [frontend-oncall]
            stop: true
          - match: {}
            chats: [frontend]
