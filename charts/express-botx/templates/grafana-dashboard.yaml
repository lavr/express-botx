{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboard.enabled }}
{{- $json := .Values.metrics.grafanaDashboard.json | default (.Files.Get "dashboards/express-botx.json") | toString }}
{{- if not (kindIs "map" (mustFromJson $json)) }}
{{- fail "metrics.grafanaDashboard.json must be a JSON object (a Grafana dashboard model)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "express-botx.dashboardName" . }}
  namespace: {{ .Values.metrics.grafanaDashboard.namespace | default .Release.Namespace | quote }}
  labels:
    {{- include "express-botx.labelsWith" (dict "context" $ "extra" .Values.metrics.grafanaDashboard.labels) | nindent 4 }}
  {{- with include "express-botx.annotations" (dict "context" $ "extra" .Values.metrics.grafanaDashboard.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  # Explicit indentation: the JSON may itself start with spaces.
  express-botx.json: |2-
{{ $json | trimSuffix "\n" | indent 4 }}
{{- end }}
