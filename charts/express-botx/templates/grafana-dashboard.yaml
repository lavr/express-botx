{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "express-botx.dashboardName" . }}
  namespace: {{ .Values.metrics.grafanaDashboard.namespace | default .Release.Namespace | quote }}
  labels:
    {{- include "express-botx.labels" . | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  express-botx.json: |-
{{ .Files.Get "dashboards/express-botx.json" | trimSuffix "\n" | indent 4 }}
{{- end }}
