name: Smoke

on: [push]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Environment info
        run: |
          go version
          uname -a
          echo "server_url=${{ github.server_url }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${GITHUB_REF_NAME:-unset}"
