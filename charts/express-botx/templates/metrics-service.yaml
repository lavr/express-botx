{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "express-botx.metricsName" . }}
  labels:
    {{- include "express-botx.labelsWith" (dict "context" $ "extra" (dict "app.kubernetes.io/component" "metrics")) | nindent 4 }}
  {{- with include "express-botx.annotations" (dict "context" $ "extra" .Values.metrics.service.annotations) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  # Always ClusterIP: the endpoint has no authentication.
  type: ClusterIP
  ports:
    - port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "express-botx.selectorLabels" . | nindent 4 }}
{{- end }}
