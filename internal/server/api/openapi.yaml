openapi: "3.1.0"
info:
  title: express-botx API
  description: HTTP API for sending messages to eXpress corporate messenger via BotX API. Supports webhooks from Alertmanager and Grafana.
  version: dev
  license:
    name: MIT
    url: https://github.com/lavr/express-botx/blob/main/LICENSE

servers:
  - url: "{scheme}://{host}{basePath}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:8080
      basePath:
        default: /api/v1

security:
  - bearerAuth: []
  - apiKeyHeader: []
  - apiKeyQuery: []

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      description: Returns server health status. No authentication required.
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /bot/list:
    get:
      operationId: botList
      summary: List configured bots
      description: Returns the list of bots from the config file. Secrets are not exposed.
      responses:
        "200":
          description: List of bots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BotEntry"
              example:
                - name: deploy-bot
                  host: express.company.ru
                  id: 054af49e-5e18-4dca-ad73-4f96b6de63fa
                - name: alert-bot
                  host: express.company.ru
                  id: 99887766-5544-3322-1100-aabbccddeeff
        "401":
          description: No credentials provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chats/alias/list:
    get:
      operationId: chatsAliasList
      summary: List chat aliases
      description: >
        Returns the list of chat aliases from the config file, including bot bindings.
        A key restricted to a chat scope sees only the chats in its own scope.
      responses:
        "200":
          description: List of chat aliases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatEntry"
              example:
                - name: deploy
                  id: 7ee8aaa9-c6cb-5ee6-8445-7d654819b285
                  bot: deploy-bot
                - name: alerts
                  id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  bot: alert-bot
                - name: general
                  id: f40f109f-3c15-577c-987a-55473e7390d1
        "401":
          description: No credentials provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /send:
    post:
      operationId: send
      summary: Send a message
      description: |
        Send a text message and/or file to one or more eXpress chats.
        Supports JSON and multipart/form-data content types.
        At least one of `message` or `file` is required.

        **Multi-chat fan-out.** `chat_id` may list several chats separated by
        commas (`chat_id=a,b,c`). The message is delivered best-effort to every
        listed chat; duplicates are collapsed, order is preserved. Chat and bot
        are resolved per target, and inline `@mention[...]` tokens are parsed with
        each target bot's own resolver.

        **⚠️ Breaking change (response format).** The response is now always a
        `MultiSendResponse` — a `results[]`/`errors[]` envelope — even for a single
        chat (previously `{"ok":true,"sync_id":"..."}`). Per-chat success carries
        `sync_id` (sync) or `request_id`+`queued:true` (async). HTTP status is
        `200` when at least one sync delivery succeeded, `202` for async enqueue,
        `502` when delivery to every chat failed. Request-level failures (bad JSON,
        empty `chat_id`, invalid `status`, unsupported media type) keep the old
        `{"ok":false,"error":"..."}` form with `400`/`415` and are NOT reported in
        `errors[]`.

        **Async expand.** In async mode (`serve --enqueue`) a multi-chat `chat_id`
        is expanded into N independent queue messages (one per chat) so each chat
        retries/acks on its own without duplicates; the worker is unchanged.

        `chat_id` is optional when a default chat is configured (`default: true` in chats section).

        In multi-bot mode, `bot` is required unless the chat alias has a default bot binding in config.

        By default, inline mention tokens (`@mention[...]`) in the `message` field are automatically
        parsed and normalized into BotX wire-format mentions. Supported syntax:
        - `@mention[email:<address>]` — resolve user by email
        - `@mention[email:<address>;<url-encoded name>]` — with display name override
        - `@mention[huid:<uuid>]` — mention by HUID (no lookup)
        - `@mention[huid:<uuid>;<url-encoded name>]` — with display name
        - `@mention[all]` — broadcast mention

        Parsed mentions are appended to any raw `mentions` provided in the request body.
        On parse or lookup errors, the token remains as literal text and the message is still sent.
        Use `?no_parse=true` to disable inline parsing entirely.
      parameters:
        - name: no_parse
          in: query
          description: |
            Disable inline `@mention[...]` parsing. When set to `true`, mention tokens
            in the message text are left as-is without normalization.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
            examples:
              text:
                summary: Text message
                value:
                  chat_id: "1a2b3c4d-5e6f-7890-abcd-ef1234567890"
                  message: "Deploy completed successfully"
              error:
                summary: Error notification
                value:
                  chat_id: ops-alerts
                  message: "Build #42 failed"
                  status: error
              mentions:
                summary: Message with raw mentions (BotX wire-format)
                value:
                  chat_id: "1a2b3c4d-5e6f-7890-abcd-ef1234567890"
                  message: "@{mention:aaa-bbb} Deploy completed"
                  mentions:
                    - mention_id: aaa-bbb
                      mention_type: user
                      mention_data:
                        user_huid: "f16cdc5f-6366-5552-9ecd-c36290ab3d11"
                        name: "Иван"
              inline_mention:
                summary: Message with inline mention (auto-parsed)
                value:
                  chat_id: "1a2b3c4d-5e6f-7890-abcd-ef1234567890"
                  message: "Привет, @mention[email:user@company.ru]!"
              file:
                summary: Message with file
                value:
                  chat_id: "1a2b3c4d-5e6f-7890-abcd-ef1234567890"
                  message: "See attached report"
                  file:
                    name: report.txt
                    data: SGVsbG8gV29ybGQ=
          multipart/form-data:
            schema:
              type: object
              properties:
                chat_id:
                  type: string
                  description: Target chat UUID or alias (optional if default chat configured)
                message:
                  type: string
                file:
                  type: string
                  format: binary
                status:
                  type: string
                  enum: [ok, error]
                bot:
                  type: string
                opts:
                  type: string
                  description: JSON string with delivery options
                metadata:
                  type: string
                  description: Arbitrary JSON string
                mentions:
                  type: string
                  description: JSON string containing an array of mentions in BotX API wire format
      responses:
        "200":
          description: |
            Delivered synchronously to at least one chat. Body is a
            `MultiSendResponse`; each `results` entry carries a `sync_id`, and any
            per-chat failures are listed in `errors`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"
              example:
                ok: true
                results:
                  - chat: deploy
                    sync_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                errors:
                  - chat: missing-alias
                    error: "resolving chat: unknown chat alias"
        "202":
          description: |
            Accepted for asynchronous delivery (`serve --enqueue`). A multi-chat
            `chat_id` is expanded into one queued message per chat; each `results`
            entry carries `request_id` and `queued:true`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"
              example:
                ok: true
                results:
                  - chat: a
                    request_id: "0d6d7f87-0a2f-4c5b-b0d4-4d0b705a77e2"
                    queued: true
                  - chat: b
                    request_id: "1e7e8f98-1b3f-5d6c-c1e5-5e1c816b88f3"
                    queued: true
        "400":
          description: |
            Request-level error (empty `chat_id`, missing body, invalid `status`,
            malformed JSON). Keeps the `{"ok":false,"error":"..."}` form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_chat:
                  value:
                    ok: false
                    error: "chat_id is required"
                missing_body:
                  value:
                    ok: false
                    error: "message or file required"
        "401":
          description: No credentials provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid credentials, or the target chat is outside this API key's chat scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: |
            Delivery to every listed chat failed. Body is a `MultiSendResponse`
            with `ok:false` and one `errors` entry per chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"
              example:
                ok: false
                errors:
                  - chat: a
                    error: "upstream error: 502 Bad Gateway"

  /alertmanager:
    post:
      operationId: alertmanager
      summary: Alertmanager webhook
      description: |
        Receives webhook notifications from Prometheus Alertmanager.
        Renders alerts through a Go template and sends the result to eXpress.

        **Multi-chat fan-out.** `?chat_id=` may list several chats separated by
        commas (`?chat_id=a,b,c`); the rendered alert is delivered best-effort to
        each. The response is always a `MultiSendResponse` (see the breaking-change
        note on `/send`), even for a single or default chat.

        Chat resolution priority:
        1. `?chat_id=` query parameter (comma-separated for fan-out)
        2. `default_chat_id` from webhook config
        3. Global default chat (`default: true` in chats section)
        4. Single chat alias from config
      parameters:
        - name: chat_id
          in: query
          description: Target chat UUID or alias; comma-separated for multi-chat fan-out (overrides config default)
          schema:
            type: string
        - name: bot
          in: query
          description: Bot name (required in multi-bot mode unless chat has a default bot binding)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertmanagerWebhook"
            example:
              version: "4"
              groupKey: '{}:{alertname="HighCPU"}'
              status: firing
              receiver: express
              groupLabels:
                alertname: HighCPU
              commonLabels:
                alertname: HighCPU
                env: prod
              commonAnnotations:
                summary: CPU is too high
              externalURL: http://alertmanager:9093
              alerts:
                - status: firing
                  labels:
                    alertname: HighCPU
                    severity: critical
                    instance: web-01:9090
                  annotations:
                    summary: "CPU > 90% on web-01"
                  startsAt: "2026-03-13T20:00:00.000Z"
                  endsAt: "0001-01-01T00:00:00Z"
                  generatorURL: http://prometheus:9090/graph
      responses:
        "200":
          description: |
            Alert delivered to at least one chat. Body is a `MultiSendResponse`
            (`results` with a per-chat `sync_id`; partial failures in `errors`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"
        "400":
          description: Request-level error (malformed JSON, no alerts, empty chat_id, template error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No credentials provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid credentials, or the target chat is outside this API key's chat scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Delivery to every listed chat failed (`MultiSendResponse` with `ok:false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"

  /command:
    post:
      operationId: command
      summary: BotX command callback
      description: |
        Receives command callbacks from the eXpress BotX platform.
        Parses the event type from the command body, routes to matching handler rules,
        and responds with 202 Accepted.

        This endpoint is registered only when `server.callbacks` is configured.
        Authentication uses JWT signed by the bot secret (Authorization: Bearer <jwt>),
        controlled by the `verify_jwt` setting.

        Event types are derived from the `command.body` field:
        - `system:chat_created` → `chat_created`
        - `system:added_to_chat` → `added_to_chat`
        - Plain text → `message`
        - etc.
      security:
        - callbackJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallbackPayload"
            example:
              sync_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              command:
                body: "system:chat_created"
                command_type: "system"
                data: {}
              from:
                user_huid: "f16cdc5f-6366-5552-9ecd-c36290ab3d11"
                group_chat_id: "30dc1980-643a-00ad-3c67-d5071b13e0d7"
                chat_type: "group_chat"
                host: "express.company.ru"
              bot_id: "054af49e-5e18-4dca-ad73-4f96b6de63fa"
              proto_version: 4
      responses:
        "202":
          description: Callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackAcceptedResponse"
        "400":
          description: Invalid request (malformed JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: JWT verification failed or missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notification/callback:
    post:
      operationId: notificationCallback
      summary: BotX notification callback
      description: |
        Receives delivery status callbacks from the eXpress BotX platform.
        Routes as `notification_callback` event to matching handler rules
        and responds with 200 OK.

        This endpoint is registered only when `server.callbacks` is configured.
        Authentication uses JWT signed by the bot secret (Authorization: Bearer <jwt>),
        controlled by the `verify_jwt` setting.
      security:
        - callbackJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCallbackPayload"
            example:
              sync_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              status: "ok"
              result: {}
      responses:
        "200":
          description: Callback processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackOkResponse"
        "400":
          description: Invalid request (malformed JSON)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: JWT verification failed or missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /grafana:
    post:
      operationId: grafana
      summary: Grafana webhook
      description: |
        Receives webhook notifications from Grafana Alerting.
        Renders alerts through a Go template and sends the result to eXpress.

        **Multi-chat fan-out.** `?chat_id=` may list several chats separated by
        commas (`?chat_id=a,b,c`); the rendered alert is delivered best-effort to
        each. The response is always a `MultiSendResponse` (see the breaking-change
        note on `/send`), even for a single or default chat.

        Chat resolution priority:
        1. `?chat_id=` query parameter (comma-separated for fan-out)
        2. `default_chat_id` from webhook config
        3. Global default chat (`default: true` in chats section)
        4. Single chat alias from config
      parameters:
        - name: chat_id
          in: query
          description: Target chat UUID or alias; comma-separated for multi-chat fan-out (overrides config default)
          schema:
            type: string
        - name: bot
          in: query
          description: Bot name (required in multi-bot mode unless chat has a default bot binding)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrafanaWebhook"
            example:
              receiver: express
              status: firing
              orgId: 1
              alerts:
                - status: firing
                  labels:
                    alertname: HighCPU
                    grafana_folder: Production
                  annotations:
                    summary: "CPU > 90% on web-01"
                  startsAt: "2026-03-13T20:00:00.000Z"
                  endsAt: "0001-01-01T00:00:00Z"
                  fingerprint: abc123def456
                  dashboardURL: http://grafana:3000/d/dashboard-uid
                  panelURL: http://grafana:3000/d/dashboard-uid?viewPanel=1
                  silenceURL: http://grafana:3000/alerting/silence/new
                  values:
                    B: 95.2
              groupLabels:
                alertname: HighCPU
              commonLabels:
                alertname: HighCPU
              commonAnnotations:
                summary: "CPU > 90% on web-01"
              externalURL: http://grafana:3000
              version: "1"
              groupKey: '{}:{alertname="HighCPU"}'
              truncatedAlerts: 0
              title: "[FIRING:1] HighCPU (Production)"
              state: alerting
              message: "**Firing**\n\nValue: B=95.2"
      responses:
        "200":
          description: |
            Alert delivered to at least one chat. Body is a `MultiSendResponse`
            (`results` with a per-chat `sync_id`; partial failures in `errors`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"
        "400":
          description: Request-level error (malformed JSON, no alerts, empty chat_id, template error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No credentials provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid credentials, or the target chat is outside this API key's chat scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Delivery to every listed chat failed (`MultiSendResponse` with `ok:false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"

  /incidentrelay:
    post:
      operationId: incidentrelay
      summary: IncidentRelay webhook
      description: |
        Receives notifications from IncidentRelay's generic webhook channel.

        IncidentRelay posts a flat, single-alert JSON object with no `alerts[]`
        array, so `/alertmanager` and `/grafana` reject it. Its `text` field
        already holds the fully rendered notification, which this endpoint
        forwards unchanged by default.

        **Message source.** `message_source: webhook` (the default) sends
        `text`; when it is empty it falls back to `title` + `message`.
        `message_source: template` ignores `text` and renders the Go template.
        A payload whose `text`, `title` and `message` are all empty is rejected
        rather than delivered as an empty notification, so the template is only
        reached through the explicit `template` mode.

        **Status.** `resolved` maps to `ok`; any other status maps to `error`
        when `severity` is listed in `error_severities` (default
        `[critical, high]`), otherwise to `ok`.

        **Authentication.** IncidentRelay's webhook channel has no header
        configuration, so this endpoint is normally reached with `?api_key=`;
        see the `apiKeyQuery` security scheme.

        **Multi-chat fan-out.** `?chat_id=` may list several chats separated by
        commas; the notification is delivered best-effort to each. The response
        is always a `MultiSendResponse`.

        Chat resolution priority:
        1. `?chat_id=` query parameter (comma-separated for fan-out)
        2. `default_chat_id` from webhook config
        3. Global default chat (`default: true` in chats section)
        4. Single chat alias from config
      parameters:
        - name: chat_id
          in: query
          description: Target chat UUID or alias; comma-separated for multi-chat fan-out (overrides config default)
          schema:
            type: string
        - name: bot
          in: query
          description: Bot name (required in multi-bot mode unless chat has a default bot binding)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentRelayWebhook"
            example:
              text: "NOTIFICATION: [P2] Disk almost full\nTeam: sre\nService: storage\nStatus: firing\nSeverity: critical\nAlert URL: http://incidentrelay/alerts/42"
              alert_id: 42
              alert_url: http://incidentrelay/alerts/42
              source_event_url: null
              team: sre
              status: firing
              source: grafana
              title: Disk almost full
              message: "node-1 at 94%"
              severity: critical
              priority: P2
              priority_label: P2 High
              assignee: ivanov
              service: storage
              service_id: 7
              service_name: Storage
              service_slug: storage
              service_links:
                - id: 1
                  type: dashboard
                  label: Board
                  url: http://grafana:3000/d/1
              service_runbooks:
                - id: 2
                  title: Disk runbook
                  url: http://wiki/runbooks/disk
                  severity: critical
              correlation: null
      responses:
        "200":
          description: |
            Notification delivered to at least one chat. Body is a `MultiSendResponse`
            (`results` with a per-chat `sync_id`; partial failures in `errors`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"
        "400":
          description: Request-level error (malformed JSON, no content in payload, empty chat_id, template error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No credentials provided, or a query key whose config does not allow query authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid credentials, or the target chat is outside this API key's chat scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Delivery to every listed chat failed (`MultiSendResponse` with `ok:false`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"

  /mattermost/api/v4/posts:
    post:
      operationId: mattermostCreatePost
      summary: Mattermost-compatible post (IncidentRelay bot_api channel)
      description: |
        Accepts the post that IncidentRelay's `mattermost` channel sends in
        `bot_api` mode, so IncidentRelay can deliver to eXpress without a
        generic webhook and without a key in the URL: the channel authenticates
        with `Authorization: Bearer <api-key>`, which this gateway already
        understands.

        Only the two post endpoints are implemented, and they live under
        express-botx's own base path rather than at the bare Mattermost path.
        Point the channel's `api_url` at `<external_url>/api/v1/mattermost` and
        IncidentRelay appends `api/v4/posts` itself.

        **Content.** IncidentRelay leaves `message` empty and puts everything in
        `props.attachments[0]`. The delivered notification is the attachment's
        `title`, `text`, each non-empty `fields[]` entry as `title: value`, and
        `title_link` (the alert's URL in IncidentRelay) on its own line. A
        non-empty `message` is kept ahead of the attachments. `actions` are
        ignored: eXpress does not render buttons.

        **State.** The first attachment's `fields[]` decide, because
        IncidentRelay always puts the raw `Status` and `Severity` there.
        `Status: resolved` and `Status: acknowledged` map to BotX
        `notification.status: ok`; a `Severity` in `error_severities` (default
        `[critical, high]`) maps to `error`; a `Severity` in
        `warning_severities` (default `[warning, warn]`) and everything else map
        to `ok`. The attachment's `color` is ignored — it is the same
        information projected lossily onto four hex values.

        The state also picks the emoji that leads each attachment: resolved
        green, acknowledged yellow, error red, warning orange, anything else
        blue. The BotX status has no visible effect in eXpress, so the emoji is
        the severity signal the on-call actually sees.

        **Chat.** `channel_id` is the target chat UUID or alias. When it is
        absent the endpoint falls back to `default_chat_id`, then the global
        default chat, then the single configured chat alias. There is no
        fan-out: the response must name exactly one message.

        **Response.** `id` is the BotX `sync_id` of the delivered message, which
        IncidentRelay stores as `external_message_id` and later sends back to
        the update endpoint. `channel_id` is echoed exactly as requested;
        IncidentRelay flags a `channel_mismatch` otherwise.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MattermostPost"
            example:
              channel_id: 054af49e-5e18-4dca-ad73-4f96b6de63fa
              message: ""
              props:
                attachments:
                  - fallback: Disk almost full
                    color: "#d9534f"
                    title: "[P2] Disk almost full"
                    text: "node-1 at 94%"
                    title_link: http://incidentrelay/alerts/42
                    fields:
                      - short: true
                        title: Team
                        value: sre
                      - short: true
                        title: Severity
                        value: critical
      responses:
        "200":
          description: Message delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MattermostPostResponse"
        "400":
          description: Request-level error (malformed JSON, no content in payload, no chat to address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No credentials provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid credentials, or the target chat is outside this API key's chat scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Delivery failed upstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mattermost/api/v4/posts/{post_id}:
    put:
      operationId: mattermostUpdatePost
      summary: Replace an already delivered post
      description: |
        Replaces the body of a message already delivered through
        `POST /mattermost/api/v4/posts`. IncidentRelay calls this when an alert
        is acknowledged or resolved, passing the `id` it got back.

        `post_id` is the BotX `sync_id`, and the edit goes to BotX
        `POST /api/v3/botx/events/edit_event`, so the notification is updated in
        place rather than duplicated. The bot that performs the edit is resolved
        from `channel_id`, not stored against `post_id`, so re-binding a chat to
        a different bot between the create and the update breaks the update.

        A chat-scoped API key is refused with `403`: a `post_id` does not carry
        the chat its message lives in, so the key's scope cannot be applied. The body is rendered exactly as it is for
        a new post; the response echoes `post_id` and the requested
        `channel_id`.

        Returns `501` when the runtime has no editor — an async (`--enqueue`)
        server never registers these endpoints, so this only shows up for a
        library caller that omitted the option.
      security:
        - bearerAuth: []
        - apiKeyHeader: []
      parameters:
        - name: post_id
          in: path
          required: true
          description: The `id` returned when the post was created (a BotX `sync_id`)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MattermostPost"
            example:
              id: 0197c2cd-0b0e-7c8e-9d4a-6f1a2b3c4d5e
              channel_id: 054af49e-5e18-4dca-ad73-4f96b6de63fa
              message: ""
              props:
                attachments:
                  - color: "#2e7d32"
                    title: "RESOLVED: [P2] Disk almost full"
                    text: The alert has been resolved.
      responses:
        "200":
          description: Message replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MattermostPostResponse"
        "400":
          description: Request-level error (malformed JSON, no content in payload, no chat to address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No credentials provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid credentials, or the target chat is outside this API key's chat scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: This server cannot edit messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The upstream edit failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gitlab:
    post:
      operationId: gitlab
      summary: GitLab group/project webhook (universal)
      description: |
        Receives **any** GitLab group/project webhook notification and forwards
        it to eXpress. There is no fixed list of supported events: the event key
        is derived generically from the payload as `kind` or `kind.subtype`,
        where `kind` is `object_kind` and the subtype depends on the kind:

        - `merge_request`, `issue` → `object_attributes.action`
        - `note` → `object_attributes.noteable_type`
        - `pipeline` → `object_attributes.status`
        - `build` (job) → `build_status` (a flat top-level field)
        - `push`, `tag_push` → no subtype (bare kind)
        - otherwise → `object_attributes.action`, then `object_attributes.status`,
          then a flat top-level `status` (e.g. deployment events)

        `server.gitlab.senders[]` is the complete configuration model. The
        `X-Gitlab-Token` selects one sender, and all subsequent processing uses
        only that sender's settings:
        - **Filter** (`server.gitlab.senders[].events.only` / `.exclude`): each entry matches
          a full event key (`kind.subtype`), a bare `kind` (all subtypes), or a
          `kind.*` wildcard. `only` empty admits everything; `exclude` always wins.
          A filtered-out event returns `200 OK` with
          `{"ok":true,"ignored":true,"event":"<key>","reason":"event filtered"}`
          and no message is sent.
        - **Templates** (`server.gitlab.senders[].templates` / `.template_files`): the message
          is rendered by selecting the template for the exact event key, then the
          bare kind, then a generic `default` — so every event always renders.
        - **error_events** (`server.gitlab.senders[].error_events`): event keys matching this
          list are delivered with BotX `notification.status=error`; everything else
          is `ok`. Matched with the same rules as the filter.
        - **routes** (`server.gitlab.senders[].routes`): an optional ordered list of routing
          rules. When configured (and no explicit `?chat_id=` bypasses them), an
          incoming event fans out to the chats of **every** matching rule (their
          chats are unioned and de-duplicated, preserving order); a matching rule
          with `stop:true` ends the scan. Each rule matches on selectors —
          reserved names (`kind`/`event`/`action`/`project`/`branch`/`user`/`title`/`url`)
          or a dotted raw-payload path — against glob (`group/backend/*`) or
          `/regex/` patterns (the `event` selector uses event-key matching instead).
          When no rule matches, the event is ignored with `200` and
          `reason:"no route matched"`; use an explicit final `match: {}` route for
          catch-all delivery. Fan-out is
          best-effort: the response is `200` with a `MultiSendResponse` when at
          least one delivery succeeds (partial failures are listed in `errors`), or
          `502` when they all fail.

        Authentication uses the `X-Gitlab-Token` header (GitLab cannot send
        `Authorization`/`X-API-Key`). This endpoint is registered only when
        `server.gitlab.senders` is configured and non-empty. Each sender has a
        required `secret` and at least one of `chats` or `routes`. A non-empty
        `chats` list is the explicit scope and every route target must be within
        it; without `chats`, scope is derived from the union of route targets.
        Aliases and their canonical UUIDs are equivalent for scope checks.

        Chat selection for the authenticated sender:
        1. When `?chat_id=` is present, it bypasses routes and selects a
           comma-separated subset of the sender's scope. An empty value is `400`;
           any out-of-scope chat — or an in-scope chat named by an alias whose
           bot binding contradicts the sender's configured target for that
           chat — makes the whole request `403` with no delivery.
        2. Without the query parameter, configured routes are evaluated. No match
           returns an ignored `200` response with `reason:"no route matched"`.
        3. Without routes, delivery fans out to all configured `chats`.

        `?bot=` is always ignored. In multi-bot configurations, delivery targets
        must therefore be chat aliases with an explicit bot binding.

        **⚠️ Breaking change (response format).** Every delivered event now returns
        a `MultiSendResponse` (`results`/`errors` envelope), including single-chat
        `?chat_id=` and single default-chat delivery (previously a bare
        `SuccessResponse`). Filtered-out events still return `GitlabIgnoredResponse`.
      security:
        - gitlabToken: []
      parameters:
        - name: chat_id
          in: query
          description: |
            Target chat UUID or alias, comma-separated for multi-chat fan-out.
            When present, bypasses the authenticated sender's routes and selects
            only an in-scope subset. Aliases and their canonical UUIDs are
            equivalent; any out-of-scope value — or an in-scope chat named by an
            alias whose bot binding contradicts the sender's configured target
            for that chat — yields `403`, and an explicitly empty value yields
            `400`.
          schema:
            type: string
        - name: bot
          in: query
          description: Always ignored. The bot is selected by the configured chat alias binding.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitlabWebhook"
            example:
              object_kind: merge_request
              user:
                name: Jane Developer
                username: jane
              project:
                name: backend
                web_url: https://gitlab.company.ru/team/backend
              object_attributes:
                action: open
                title: "Add rate limiting to API"
                url: https://gitlab.company.ru/team/backend/-/merge_requests/42
                source_branch: feature/rate-limit
                target_branch: main
                detailed_merge_status: mergeable
      responses:
        "200":
          description: |
            Event processed. The body depends on how the event was delivered:
            - Delivered to at least one chat (query selection, routes fan-out,
              or all configured sender chats): a
              `MultiSendResponse` with a `results` entry per successful chat and
              an `errors` entry per failed chat (`ok:true`).
            - Filtered out, rendered empty, or matched no route: a
              `GitlabIgnoredResponse` (`ok:true`, `ignored:true`, `event:<key>`)
              and no message is sent. `reason` names the cause: `event filtered`,
              `empty message`, or `no route matched`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MultiSendResponse"
                  - $ref: "#/components/schemas/GitlabIgnoredResponse"
        "400":
          description: Invalid request (malformed JSON, template error, or an explicitly empty `?chat_id=`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid X-Gitlab-Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |
            The authenticated sender requested a `?chat_id=` it may not deliver
            to; nothing is sent. Two cases: the chat is outside the sender's
            scope, or it is in scope but named by an alias whose bot binding
            contradicts the sender's configured target for that chat. Scope is
            explicit `server.gitlab.senders[].chats` or, when omitted, the union
            of that sender's route targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: |
            Delivery to all target chats failed. Body is a `MultiSendResponse`
            (`ok:false`) whose `errors` list the per-chat failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiSendResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <api-key>"
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: "X-API-Key: <api-key>"
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: |
        `?api_key=<api-key>` — fallback for senders that cannot set headers at
        all, such as IncidentRelay's generic webhook channel. Consulted only
        when neither `Authorization` nor `X-API-Key` is present, and only for a
        key configured with `allow_query_auth: true`. The value is removed from
        the request URL before logging, tracing and error reporting, but it
        still reaches reverse-proxy logs and whatever stores the URL, so use a
        dedicated key scoped with `chats:`.
    botSignature:
      type: apiKey
      in: header
      name: X-Bot-Signature
      description: HMAC-SHA256 signature for bot secret auth
    callbackJWT:
      type: http
      scheme: bearer
      description: "JWT signed with bot secret (HS256). Used for callback endpoints from eXpress platform."
    gitlabToken:
      type: apiKey
      in: header
      name: X-Gitlab-Token
      description: "X-Gitlab-Token: <secret token> — matched against `server.gitlab.senders[].secret`; the matching sender owns all subsequent filtering, rendering, routing, and chat scope."

  schemas:
    SendRequest:
      type: object
      properties:
        chat_id:
          type: string
          description: Target chat UUID or alias (optional if default chat configured)
          example: "1a2b3c4d-5e6f-7890-abcd-ef1234567890"
        message:
          type: string
          description: Message text
          example: "Deploy completed"
        file:
          $ref: "#/components/schemas/FilePayload"
        status:
          type: string
          enum: [ok, error]
          default: ok
          description: Notification status (affects visual styling in eXpress)
        bot:
          type: string
          description: |
            Bot name for multi-bot setups. Resolution priority:
            1. Explicit `bot` field in request
            2. Default bot from chat alias config
            3. Single bot (auto-selected if only one configured)
            If none of the above resolve a bot, returns 400.
        opts:
          $ref: "#/components/schemas/OptsPayload"
        metadata:
          type: object
          description: Arbitrary JSON passed to notification.metadata
        mentions:
          type: array
          description: |
            Array of mentions in BotX API wire format. The message text must already contain
            the correct placeholders (@{mention:...}, @@{mention:...}, ##{mention:...}).
            Passed through to BotX API without modification.
          items:
            type: object
            properties:
              mention_id:
                type: string
                description: Unique mention identifier referenced in message placeholders
              mention_type:
                type: string
                description: "Type of mention: user, contact, chat, channel, all"
              mention_data:
                type: object
                description: Mention-specific data (user_huid, name, etc.)

    FilePayload:
      type: object
      required: [name, data]
      properties:
        name:
          type: string
          description: File name
          example: report.txt
        data:
          type: string
          format: byte
          description: Base64-encoded file content
          example: SGVsbG8gV29ybGQ=

    OptsPayload:
      type: object
      properties:
        silent:
          type: boolean
          default: false
          description: No push notification to recipient
        stealth:
          type: boolean
          default: false
          description: Message visible only to bot
        force_dnd:
          type: boolean
          default: false
          description: Deliver even if recipient has DND enabled
        no_notify:
          type: boolean
          default: false
          description: Do not send notification at all

    AlertmanagerWebhook:
      type: object
      required: [status, alerts]
      properties:
        version:
          type: string
          example: "4"
        groupKey:
          type: string
        status:
          type: string
          enum: [firing, resolved]
        receiver:
          type: string
        groupLabels:
          type: object
          additionalProperties:
            type: string
        commonLabels:
          type: object
          additionalProperties:
            type: string
        commonAnnotations:
          type: object
          additionalProperties:
            type: string
        externalURL:
          type: string
          format: uri
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertItem"

    AlertItem:
      type: object
      properties:
        status:
          type: string
          enum: [firing, resolved]
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        generatorURL:
          type: string
          format: uri

    GrafanaWebhook:
      type: object
      required: [status, alerts]
      properties:
        receiver:
          type: string
        status:
          type: string
          enum: [firing, resolved]
        orgId:
          type: integer
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/GrafanaAlertItem"
        groupLabels:
          type: object
          additionalProperties:
            type: string
        commonLabels:
          type: object
          additionalProperties:
            type: string
        commonAnnotations:
          type: object
          additionalProperties:
            type: string
        externalURL:
          type: string
          format: uri
        version:
          type: string
        groupKey:
          type: string
        truncatedAlerts:
          type: integer
        title:
          type: string
          description: Pre-formatted alert title from Grafana
        state:
          type: string
          enum: [alerting, ok, no_data, pending]
        message:
          type: string
          description: Pre-formatted alert message from Grafana (markdown)

    MattermostPost:
      type: object
      description: |
        The subset of a Mattermost post that IncidentRelay's `bot_api` channel
        sends (`MattermostNotifier._build_post_payload`). Fields outside this
        list are accepted and ignored.
      properties:
        id:
          type: string
          description: Present on an update; the endpoint uses the `post_id` from the path instead.
        channel_id:
          type: string
          description: Target chat UUID or alias. Falls back to the configured default when empty.
        message:
          type: string
          description: Plain post text. IncidentRelay leaves it empty and uses `props.attachments`.
        props:
          type: object
          properties:
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/MattermostAttachment"

    MattermostAttachment:
      type: object
      properties:
        fallback:
          type: string
          description: Ignored; `title` and `text` carry the same content.
        color:
          type: string
          description: Border colour; ignored, the state comes from `fields[]`.
        title:
          type: string
        title_link:
          type: string
          format: uri
          description: The alert's URL in IncidentRelay; appended on its own line.
        text:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/MattermostField"
        actions:
          type: array
          description: Ignored; eXpress does not render buttons.
          items:
            type: object

    MattermostField:
      type: object
      properties:
        title:
          type: string
          description: "`Status` and `Severity` additionally decide the alert state; every field is rendered."
        value:
          description: "Rendered as `title: value`; an empty value drops the line."
        short:
          type: boolean
          description: Ignored; eXpress notifications are plain text.

    MattermostPostResponse:
      type: object
      required: [id, channel_id]
      properties:
        id:
          type: string
          description: BotX `sync_id` of the delivered message; IncidentRelay stores it as `external_message_id`.
        channel_id:
          type: string
          description: Echoed exactly as requested.
      example:
        id: 0197c2cd-0b0e-7c8e-9d4a-6f1a2b3c4d5e
        channel_id: 054af49e-5e18-4dca-ad73-4f96b6de63fa

    IncidentRelayWebhook:
      type: object
      description: |
        Flat notification payload from IncidentRelay's generic webhook channel
        (`IncomingWebhookNotifier`). There is no `alerts[]` array: one POST
        carries one alert group.
      properties:
        text:
          type: string
          description: |
            Notification already rendered by IncidentRelay. Delivered unchanged
            when `message_source` is `webhook` (the default).
        alert_id:
          type: integer
        alert_url:
          type: string
          format: uri
          nullable: true
        source_event_url:
          type: string
          format: uri
          nullable: true
        team:
          type: string
          nullable: true
        status:
          type: string
          enum: [firing, resolved, acknowledged, maintenance]
        source:
          type: string
          description: Integration the alert came from (grafana, zabbix, ...)
        title:
          type: string
        message:
          type: string
          nullable: true
        severity:
          type: string
          enum: [critical, high, medium, warning, low, info]
          nullable: true
          description: |
            Normalized by IncidentRelay before delivery (crit/error/fatal
            collapse to critical, warn to warning). Compared against
            `error_severities` to pick the eXpress message status.
        priority:
          type: string
          nullable: true
        priority_label:
          type: string
          nullable: true
        assignee:
          type: string
          nullable: true
        service:
          type: string
          nullable: true
        service_id:
          type: integer
          nullable: true
        service_name:
          type: string
          nullable: true
        service_slug:
          type: string
          nullable: true
        service_links:
          type: array
          items:
            $ref: "#/components/schemas/IncidentRelayLink"
        service_runbooks:
          type: array
          items:
            $ref: "#/components/schemas/IncidentRelayRunbook"
        correlation:
          nullable: true
          description: Correlation context, opaque to express-botx

    IncidentRelayLink:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri

    IncidentRelayRunbook:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
        severity:
          type: string

    GrafanaAlertItem:
      type: object
      properties:
        status:
          type: string
          enum: [firing, resolved]
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        generatorURL:
          type: string
          format: uri
        fingerprint:
          type: string
        silenceURL:
          type: string
          format: uri
        dashboardURL:
          type: string
          format: uri
        panelURL:
          type: string
          format: uri
        imageURL:
          type: string
          format: uri
        values:
          type: object
          additionalProperties: true

    GitlabWebhook:
      type: object
      required: [object_kind]
      description: |
        A GitLab group/project webhook payload. Accepts **any** `object_kind`;
        the endpoint decodes the payload generically and derives an event key
        (`kind` / `kind.subtype`). The properties below are the common fields
        surfaced to templates as `.Kind`/`.Action`/`.Project`/`.User`/`.Title`/`.URL`;
        the full payload is available to templates via `.Raw` and the `get` helper.
        `additionalProperties` is true — event-specific fields (`build_status`,
        `ref`, `commits`, `builds`, …) are passed through untouched.
      additionalProperties: true
      properties:
        object_kind:
          type: string
          example: merge_request
          description: |
            Event kind, e.g. `merge_request`, `note`, `push`, `tag_push`,
            `pipeline`, `build`, `issue`, `release`, `wiki_page`, `deployment`.
            Any value is accepted.
        user:
          type: object
          description: Actor that triggered the event
          properties:
            name:
              type: string
            username:
              type: string
        project:
          type: object
          properties:
            name:
              type: string
            web_url:
              type: string
              format: uri
        object_attributes:
          type: object
          additionalProperties: true
          properties:
            action:
              type: string
              description: "merge_request/issue action: open, merge, update, close, ..."
            status:
              type: string
              description: "pipeline status: pending, running, success, failed, ..."
            title:
              type: string
            url:
              type: string
              format: uri
            source_branch:
              type: string
            target_branch:
              type: string
            detailed_merge_status:
              type: string
            noteable_type:
              type: string
              description: "note events: MergeRequest, Commit, Issue, ..."
            note:
              type: string
              description: Comment text (note events)
            system:
              type: boolean
              description: True for system-generated notes (forwarded like any other note)
        merge_request:
          type: object
          description: Nested merge request block present on note events about MRs
          properties:
            title:
              type: string
            url:
              type: string
              format: uri
            source_branch:
              type: string
            target_branch:
              type: string

    SuccessResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        sync_id:
          type: string
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    GitlabIgnoredResponse:
      type: object
      description: >-
        Returned by /gitlab when an event is not delivered: filtered out by
        only/exclude, rendered to an empty message, or no sender route matched.
      properties:
        ok:
          type: boolean
          example: true
        ignored:
          type: boolean
          example: true
        event:
          type: string
          description: The derived event key that was not delivered.
          example: "merge_request.update"
        reason:
          type: string
          description: >-
            Why the event was not delivered: `event filtered`, `empty message`,
            or `no route matched`.
          example: "no route matched"

    MultiSendResponse:
      type: object
      description: |
        The uniform multi-chat fan-out response shared by `/send`, `/alertmanager`,
        `/grafana` and `/gitlab`. `ok` is true when at least one chat received the
        message (HTTP `200` sync / `202` async) and false when delivery to every
        chat failed (HTTP `502`). `results` lists each successful delivery and
        `errors` each failed one; on a partial failure both are present. Order
        follows the requested chats. Request-level failures (bad JSON, empty
        `chat_id`, invalid status, unsupported media) are NOT reported here — they
        keep the `{"ok":false,"error":"..."}` form with `400`/`415`.
      properties:
        ok:
          type: boolean
          example: true
        results:
          type: array
          description: Successful deliveries, one per chat.
          items:
            type: object
            properties:
              chat:
                type: string
                description: Target chat alias or UUID as requested.
                example: backend-mrs
              sync_id:
                type: string
                description: Synchronous delivery id (present for sync sends).
                example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
              request_id:
                type: string
                description: Enqueue request id (present for async/enqueue sends).
                example: "0d6d7f87-0a2f-4c5b-b0d4-4d0b705a77e2"
              queued:
                type: boolean
                description: True when the message was queued (async/enqueue).
                example: true
        errors:
          type: array
          description: Failed deliveries, one per chat (chat/bot resolution or upstream send).
          items:
            type: object
            properties:
              chat:
                type: string
                example: frontend-mrs
              error:
                type: string
                example: "upstream error: 502 Bad Gateway"

    BotEntry:
      type: object
      properties:
        name:
          type: string
          example: deploy-bot
        host:
          type: string
          example: express.company.ru
        id:
          type: string
          example: "054af49e-5e18-4dca-ad73-4f96b6de63fa"

    ChatEntry:
      type: object
      properties:
        name:
          type: string
          example: deploy
        id:
          type: string
          example: "7ee8aaa9-c6cb-5ee6-8445-7d654819b285"
        bot:
          type: string
          description: Default bot for this chat (empty if not bound)
          example: deploy-bot

    CallbackPayload:
      type: object
      description: BotX API v4 POST /command request body
      required: [sync_id, command, from, bot_id]
      properties:
        sync_id:
          type: string
          format: uuid
          description: Unique request identifier
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        command:
          $ref: "#/components/schemas/CallbackCommand"
        from:
          $ref: "#/components/schemas/CallbackFrom"
        bot_id:
          type: string
          format: uuid
          description: Bot identifier
          example: "054af49e-5e18-4dca-ad73-4f96b6de63fa"
        proto_version:
          type: integer
          description: Protocol version
          example: 4
        attachments:
          type: array
          description: Message attachments
          items:
            type: object
        async_files:
          type: array
          description: Metadata for asynchronously loaded files
          items:
            type: object
        entities:
          type: array
          description: Message entities (mentions, markup, etc.)
          items:
            type: object

    CallbackCommand:
      type: object
      description: Command part of a callback payload
      required: [body]
      properties:
        body:
          type: string
          description: |
            Command body text. System events use "system:" prefix
            (e.g. "system:chat_created"). Plain text means a regular message.
          example: "system:chat_created"
        command_type:
          type: string
          description: Command type identifier
          example: "system"
        data:
          type: object
          description: Additional command data
        metadata:
          type: object
          description: Command metadata

    CallbackFrom:
      type: object
      description: Sender information in a callback payload
      required: [group_chat_id]
      properties:
        user_huid:
          type: string
          format: uuid
          description: User HUID (may be empty for system events)
          example: "f16cdc5f-6366-5552-9ecd-c36290ab3d11"
        group_chat_id:
          type: string
          format: uuid
          description: Chat identifier
          example: "30dc1980-643a-00ad-3c67-d5071b13e0d7"
        chat_type:
          type: string
          description: Chat type
          example: "group_chat"
        host:
          type: string
          description: eXpress server host
          example: "express.company.ru"
        ad_chat:
          type: boolean
          description: Whether the chat is from Active Directory
        ad_group:
          type: boolean
          description: Whether the group is from Active Directory

    NotificationCallbackPayload:
      type: object
      description: BotX API v4 POST /notification/callback request body
      required: [sync_id, status]
      properties:
        sync_id:
          type: string
          format: uuid
          description: Sync ID of the original notification
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        status:
          type: string
          description: Delivery status
          example: "ok"
        result:
          type: object
          description: Delivery result data
        reason:
          type: string
          description: Reason for failure (if status is not ok)
        errors:
          type: array
          description: List of errors
          items:
            type: object
        error_data:
          type: object
          description: Additional error details

    CallbackAcceptedResponse:
      type: object
      properties:
        result:
          type: string
          example: "accepted"

    CallbackOkResponse:
      type: object
      properties:
        result:
          type: string
          example: "ok"

    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: "chat_id is required"
